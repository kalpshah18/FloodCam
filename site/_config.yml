title: FloodCam
description: >-
  Reading shallow flood depth from real USGS gauge-camera footage with a learned staff-plate reader.
  IIT Gandhinagar.
url: "https://kalpshah18.github.io"
baseurl: "/FloodCam"
lang: en

theme: just-the-docs
color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 2
  button: false
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Paper (PDF)": "/assets/paper.pdf"
  "Code on GitHub": "https://github.com/kalpshah18/FloodCam"
aux_links_new_tab: true

footer_content: >-
  FloodCam is a project by Kalp Shah, IIT Gandhinagar.
  USGS imagery and gauge data are public domain. Code and results:
  <a href="https://github.com/kalpshah18/FloodCam">github.com/kalpshah18/FloodCam</a>.

callouts_level: quiet
callouts:
  limit:
    title: Claim limit
    color: yellow
  note:
    title: Note
    color: blue
  caution:
    title: Caution
    color: red

# kramdown wraps $$...$$ in <script type="math/tex">; _includes/head_custom.html hands those to MathJax 3
kramdown:
  math_engine: mathjax
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
