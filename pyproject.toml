[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floodcam"
version = "0.1.0"
description = "Estimating shallow flood depth from fixed-camera video"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "pyyaml==6.0.1",
    "scikit-learn==1.4.2",
    "streamlit==1.35.0",
    "matplotlib==3.9.0",
    "pandas==2.2.2",
    "pillow==10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "ruff==0.4.7",
]
ml = [
    "torch==2.2.2",
    "transformers==4.40.2",
    "timm==0.9.16",
    "accelerate==0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
