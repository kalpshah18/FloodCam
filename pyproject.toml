[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floodcam"
version = "0.1.0"
description = "Estimating shallow flood depth from fixed-camera video"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "opencv-python-headless==5.0.0.93",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
    "pillow==13.0.0",
    "streamlit==1.67.0",
    "streamlit-image-coordinates==0.4.1",
    "altair==6.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
# Optional SegFormer track; not used for any reported result and not verified with NumPy 2.
ml = [
    "torch==2.2.2",
    "transformers==4.40.2",
    "timm==0.9.16",
    "accelerate==0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["torch: needs torch + transformers (the [ml] extra); skipped when missing"]
